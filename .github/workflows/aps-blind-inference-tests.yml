name: APS Blind Inference Quality Check

on:
  push:
    branches:
      - feature/demo-ready-aps
  pull_request:
    paths:
      - 'Localization/**'
      - 'Adaptive/**'
      - 'OB/**'
      - 'Simulation/**'
      - 'Tests/**'
      - 'Scripts/**'
      - 'requirements.txt'
      - '.github/workflows/aps-blind-inference-tests.yml'
  workflow_dispatch:

jobs:
  aps-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install APS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r OB/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q Localization Adaptive Simulation OB Scripts Tests
      - name: Run APS tests
        run: python -m pytest -q

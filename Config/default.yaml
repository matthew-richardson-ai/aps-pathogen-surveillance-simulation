project:
  name: "Adaptive Pathogen Surveillance"
  acronym: "APS"
  mode: "simulation"
  random_seed: 42

facility:
  zones: 8

simulation:
  source_intensity: 1.0
  decay_rate: 0.65
  runs: 100

sensors:
  noise_std: 0.08
  missing_rate: 0.10
  min_reading: 0.0
  max_reading: 1.0

localization:
  baseline: "strongest_sensor"

# Second-half feature intentionally left off at this checkpoint.
adaptive:
  enabled: false

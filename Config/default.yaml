project:
  name: "Autonomous Pathogen Surveillance"
  acronym: "APS"
  mode: "simulation"
  random_seed: 42

simulation:
  duration_steps: 100
  initial_infected_nodes: 1

sensors:
  sensitivity: 0.95
  specificity: 0.98
  false_positive_rate: 0.02
  false_negative_rate: 0.05

localization:
  top_k: 3

evaluation:
  runs: 100